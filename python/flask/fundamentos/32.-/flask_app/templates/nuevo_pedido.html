<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nuevo Pedido
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body>


<div class="container py-5">


    <div class="row justify-content-center">

        <div class="col-lg-6">


            <div class="card shadow-sm border-0">

                <div class="card-body p-4">


                    <!-- ==================================================
                         ENCABEZADO
                    =================================================== -->

                    <h1 class="h2 mb-2">
                        Nuevo Pedido
                    </h1>


                    <p class="text-muted mb-4">

                        Completa los datos del pedido.

                    </p>


                    <!-- ==================================================
                         MENSAJES FLASH
                    =================================================== -->

                    {% with messages = get_flashed_messages(
                        with_categories=true
                    ) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }}"
                                >

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- ==================================================
                         FORMULARIO
                    =================================================== -->

                    <form
                        action="{{ url_for('crear_pedido') }}"
                        method="POST"
                    >


                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label
                                for="nombre"
                                class="form-label"
                            >

                                Nombre

                            </label>


                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                class="form-control"
                                minlength="2"
                                required
                            >

                        </div>


                        <!-- TIPO DE AREPA -->

                        <div class="mb-3">

                            <label
                                for="tipo_arepa"
                                class="form-label"
                            >

                                Tipo de Arepa

                            </label>


                            <input
                                type="text"
                                id="tipo_arepa"
                                name="tipo_arepa"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- CANTIDAD -->

                        <div class="mb-4">

                            <label
                                for="cantidad"
                                class="form-label"
                            >

                                Cantidad

                            </label>


                            <input
                                type="number"
                                id="cantidad"
                                name="cantidad"
                                class="form-control"
                                min="1"
                                required
                            >

                        </div>


                        <!-- BOTONES -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >

                                Crear Pedido

                            </button>


                            <a
                                href="{{ url_for('pedidos') }}"
                                class="btn btn-outline-secondary"
                            >

                                Volver

                            </a>

                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>


</body>

</html>
