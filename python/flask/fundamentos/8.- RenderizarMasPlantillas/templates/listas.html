<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Listas</title>
</head>

<body>
   <h2>Número aleatorios</h2>
   {% for n in numeros %}
       <p>{{ n }}</p>
   {% endfor %}
   <h2>Listado de Alumnos</h2>
   <ul>
       {% for alumno in estudiantes %}
           <li>{{ alumno['nombre'] }} - {{ alumno['edad'] }}</li>
       {% endfor %}
   </ul>
</body>
</html>
