<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}Registro de productos{% endblock %}
    </title>

    <!-- ==================================================
    BOOTSTRAP (Versión estable 5.3.3)
    =================================================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- ==================================================
    BOOTSTRAP ICONS
    =================================================== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
                <i class="bi bi-bag-check-fill text-success fs-4"></i>
                <span class="fw-bold">ProductApp</span>
            </a>

            <!-- Botón Hamburguesa para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Enlaces de navegación colapsables -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto gap-2 mt-2 mt-lg-0">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">
                        <i class="bi bi-plus-circle me-1"></i>Registrar
                    </a>
                    <a class="nav-link {% if request.path == '/resultado' %}active{% endif %}" href="{{ url_for('products') }}">
                        <i class="bi bi-grid-3x3-gap me-1"></i>Ver Productos
                    </a>
                    <a class="nav-link {% if request.path == '/ayuda' %}active{% endif %}" href="{{ url_for('help') }}">
                        <i class="bi bi-question-circle me-1"></i>Ayuda
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DINÁMICO -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- PIE DE PÁGINA (OPCIONAL) -->
    <footer class="bg-white text-center py-3 border-top mt-auto">
        <div class="container">
            <small class="text-muted">&copy; 2026 Registro de Productos - Panel de Control</small>
        </div>
    </footer>

    <!-- BOOTSTRAP BUNDLE JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
