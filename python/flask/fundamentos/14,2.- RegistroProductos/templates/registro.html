{% extends "index.html" %}

{% block title %}
Registro
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        
        <!-- Encabezado estilizado -->
        <header class="text-center mb-4">
            <h1 class="display-6 fw-bold text-dark">Registro de Productos</h1>
            <p class="text-muted">Ingresa los datos para añadir un nuevo artículo al inventario</p>
        </header>

        <!-- Tarjeta del Formulario -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form action="/registrar" method="POST">
                    
                    <!-- Campo: Nombre -->
                    <div class="mb-3">
                        <label for="productName" class="form-label fw-semibold">Nombre del producto</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-box-seam"></i></span>
                            <input 
                                type="text"
                                id="productName"
                                name="productName"
                                class="form-control"
                                placeholder="Ej: Monitor Gamer 24'"
                                required>
                        </div>
                    </div>

                    <!-- Campo: Precio -->
                    <div class="mb-3">
                        <label for="price" class="form-label fw-semibold">Precio del producto</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">$</span>
                            <input 
                                type="number"
                                id="price"
                                name="price"
                                min="0"
                                class="form-control"
                                placeholder="900"
                                required>
                        </div>
                    </div>

                    <!-- Campo: Categoría (Corregido el label) -->
                    <div class="mb-4">
                        <label for="category" class="form-label fw-semibold">Categoría</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-tag"></i></span>
                            <input 
                                type="text"
                                id="category"
                                name="category"
                                class="form-control"
                                placeholder="Ej: Electrónica"
                                required>
                        </div>
                    </div>

                    <!-- Botón de Envío Estilizado -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="bi bi-cloud-arrow-up-fill me-2"></i>Subir producto
                    </button>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
