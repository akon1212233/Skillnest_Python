<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Editar Usuario {{ usuario.id }}
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <!-- ==================================================
                 ENCABEZADO
            =================================================== -->

            <div class="page-header">

                <div>

                    <h1>
                        Editar usuario {{ usuario.id }}
                    </h1>

                    <p class="text-muted">
                        Modifica la información del usuario.
                    </p>

                </div>

            </div>


            <!-- ==================================================
                 FORMULARIO
            =================================================== -->

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">


                    {% if error %}

                        <div class="alert alert-danger">

                            {{ error }}

                        </div>

                    {% endif %}


                    <form
                        action="{{ url_for('actualizar_usuario', id=usuario.id) }}"
                        method="POST"
                    >


                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label
                                for="nombre"
                                class="form-label"
                            >
                                Nombre
                            </label>


                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                class="form-control"
                                value="{{ usuario.nombre }}"
                                maxlength="45"
                                required
                            >

                        </div>


                        <!-- APELLIDO -->

                        <div class="mb-3">

                            <label
                                for="apellido"
                                class="form-label"
                            >
                                Apellido
                            </label>


                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                class="form-control"
                                value="{{ usuario.apellido }}"
                                maxlength="45"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label"
                            >
                                E-mail
                            </label>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                value="{{ usuario.email }}"
                                maxlength="45"
                                required
                            >

                        </div>


                        <!-- ==================================================
                             BOTONES
                        =================================================== -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Actualizar
                            </button>


                            <a
                                href="{{ url_for('ver_usuario', id=usuario.id) }}"
                                class="btn btn-outline-secondary"
                            >
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
