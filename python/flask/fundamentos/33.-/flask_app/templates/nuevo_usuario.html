<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nuevo Usuario
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

</head>

<body>

<div class="container py-5">


    <div class="row justify-content-center">

        <div class="col-lg-7">


            <div class="card shadow-sm border-0">

                <div class="card-body p-4">


                    <h1 class="mb-2">
                        Crear nuevo usuario
                    </h1>

                    <p class="text-muted mb-4">

                        Completa la información del usuario.

                    </p>


                    <!-- ==================================================
                         MENSAJES FLASH
                    =================================================== -->

                    {% with messages = get_flashed_messages(
                        with_categories=true
                    ) %}

                        {% if messages %}

                            {% for category, message in messages %}

                                <div
                                    class="alert alert-{{ category }}"
                                >

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <!-- ==================================================
                         FORMULARIO
                    =================================================== -->

                    <form
                        action="{{ url_for('crear_usuario') }}"
                        method="POST"
                    >


                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label
                                for="nombre"
                                class="form-label"
                            >

                                Nombre

                            </label>


                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                class="form-control"
                                value="{{ datos_formulario.get('nombre', '') }}"
                                required
                            >

                        </div>


                        <!-- APELLIDO -->

                        <div class="mb-3">

                            <label
                                for="apellido"
                                class="form-label"
                            >

                                Apellido

                            </label>


                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                class="form-control"
                                value="{{ datos_formulario.get('apellido', '') }}"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label"
                            >

                                E-mail

                            </label>


                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                value="{{ datos_formulario.get('email', '') }}"
                                required
                            >

                        </div>


                        <!-- BOTONES -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >

                                Crear

                            </button>


                            <a
                                href="{{ url_for('usuarios') }}"
                                class="btn btn-outline-secondary"
                            >

                                Volver

                            </a>

                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>

</div>

</body>

</html>
