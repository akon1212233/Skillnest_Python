<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tacos</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">


    <!-- ==================================================
         NAVEGACIÓN
    =================================================== -->

    <div class="mb-4">

        <a
            href="{{ url_for('index') }}"
            class="btn btn-info"
        >

            Inicio

        </a>

    </div>


    <h1 class="mb-4">

        Todos los tacos

    </h1>


    <!-- ==================================================
         TACOS
    =================================================== -->

    <div class="row g-4">


        {% for taco in todos_tacos %}


            <div class="col-12 col-md-6 col-lg-4">


                <div class="card h-100 shadow-sm">


                    <div class="card-body">


                        <h2 class="card-title text-primary">

                            Taco {{ taco.id }}

                        </h2>


                        <p>

                            <strong>Tortilla:</strong>

                            {{ taco.tortilla }}

                            <br>

                            <strong>Guiso:</strong>

                            {{ taco.guiso }}

                            <br>

                            <strong>Salsa:</strong>

                            {{ taco.salsa }}

                        </p>


                        <a
                            href="{{ url_for('detalle', taco_id=taco.id) }}"
                            class="btn btn-primary"
                        >

                            Ver taco

                        </a>


                    </div>


                    <div class="card-footer">

                        <small>

                            Fecha de creación:

                            {{ taco.created_at.strftime(
                                "%Y-%m-%d %H:%M:%S"
                            ) }}

                        </small>

                    </div>


                </div>


            </div>


        {% endfor %}


    </div>


</div>

</body>

</html>
