<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Formulario de Taco</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">


    <!-- ==================================================
         NAVEGACIÓN
    =================================================== -->

    <div class="mb-4">

        <a
            href="{{ url_for('tacos') }}"
            class="btn btn-success"
        >

            Ver todos los tacos

        </a>

    </div>


    <!-- ==================================================
         FORMULARIO
    =================================================== -->

    <form
        action="{{ url_for('crear') }}"
        method="POST"
        class="p-4 col-12 col-md-6 mx-auto border rounded shadow-sm"
    >

        <h2 class="text-center text-primary mb-4">

            Crear Taco

        </h2>


        <!-- TORTILLA -->

        <div class="mb-3">

            <label
                for="tortilla"
                class="form-label"
            >

                Tortilla:

            </label>


            <input
                type="text"
                name="tortilla"
                id="tortilla"
                class="form-control"
                required
            >

        </div>


        <!-- GUISO -->

        <div class="mb-3">

            <label
                for="guiso"
                class="form-label"
            >

                Guiso:

            </label>


            <input
                type="text"
                name="guiso"
                id="guiso"
                class="form-control"
                required
            >

        </div>


        <!-- SALSA -->

        <div class="mb-3">

            <label
                for="salsa"
                class="form-label"
            >

                Salsa:

            </label>


            <input
                type="text"
                name="salsa"
                id="salsa"
                class="form-control"
                required
            >

        </div>


        <!-- BOTÓN -->

        <button
            type="submit"
            class="btn btn-primary"
        >

            Crear taco

        </button>


    </form>


</div>

</body>

</html>
