<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Editar Taco
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">


    <form
        action="{{ url_for(
            'actualizar',
            taco_id=taco.id
        ) }}"
        method="POST"
        class="p-4 col-12 col-md-6 mx-auto border rounded shadow-sm"
    >


        <h2 class="text-center text-primary mb-4">

            Editar taco {{ taco.id }}

        </h2>


        <!-- ==================================================
             TORTILLA
        =================================================== -->

        <div class="mb-3">

            <label
                for="tortilla"
                class="form-label"
            >

                Tortilla:

            </label>


            <input
                type="text"
                name="tortilla"
                id="tortilla"
                class="form-control"
                value="{{ taco.tortilla }}"
                required
            >

        </div>


        <!-- ==================================================
             GUISO
        =================================================== -->

        <div class="mb-3">

            <label
                for="guiso"
                class="form-label"
            >

                Guiso:

            </label>


            <input
                type="text"
                name="guiso"
                id="guiso"
                class="form-control"
                value="{{ taco.guiso }}"
                required
            >

        </div>


        <!-- ==================================================
             SALSA
        =================================================== -->

        <div class="mb-4">

            <label
                for="salsa"
                class="form-label"
            >

                Salsa:

            </label>


            <input
                type="text"
                name="salsa"
                id="salsa"
                class="form-control"
                value="{{ taco.salsa }}"
                required
            >

        </div>


        <!-- ==================================================
             BOTONES
        =================================================== -->

        <div class="d-flex gap-2">


            <button
                type="submit"
                class="btn btn-primary"
            >

                Actualizar Taco

            </button>


            <a
                href="{{ url_for(
                    'detalle',
                    taco_id=taco.id
                ) }}"
                class="btn btn-secondary"
            >

                Cancelar

            </a>


        </div>


    </form>


</div>

</body>

</html>
