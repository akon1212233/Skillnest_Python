<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Visitas</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="visitas-card">
            <div class="icono">
                <i class="bi bi-eye-fill"></i>
            </div>

            <h1>Contador de Visitas</h1>
            <p class="descripcion">Seguimiento de visitas mediante sesiones de Flask.</p>

            <!-- CONTADOR -->
            <div class="contador">
                <span>{{ views }}</span>
            </div>

            <p class="texto-visitas">
                {% if views == 1 %}
                    Has visitado esta página 1 vez.
                {% else %}
                    Has visitado esta página {{ views }} veces.
                {% endif %}
            </p>

            <!-- BOTONES -->
            <div class="acciones">
                <a href="{{ url_for('addTwoView') }}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Sumar +2
                </a>
                <a href="{{ url_for('reset') }}" class="btn btn-warning">
                    <i class="bi bi-arrow-counterclockwise"></i> Reiniciar
                </a>
            </div>

            <!-- FORMULARIO PERSONALIZADO -->
            <div class="formulario">
                <h3>Agregar visitas</h3>
                <form action="{{ url_for('add') }}" method="POST">
                    <div class="input-group">
                        <input type="number" name="amount" min="1" class="form-control" placeholder="Ingresa una cantidad" required>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-plus-lg"></i> Agregar
                        </button>
                    </div>
                </form>
            </div>

            <!-- REINICIOS -->
            <div class="reinicios">
                <i class="bi bi-arrow-repeat"></i> Contador reiniciado: <strong>{{ resets }}</strong> veces.
            </div>

            <!-- DESTRUIR SESIÓN -->
            <div class="destruir">
                <a href="{{ url_for('destroySession') }}" class="btn btn-outline-danger">
                    <i class="bi bi-trash3-fill"></i> Destruir sesión
                </a>
            </div>
        </div>
    </div>
</body>
</html>
