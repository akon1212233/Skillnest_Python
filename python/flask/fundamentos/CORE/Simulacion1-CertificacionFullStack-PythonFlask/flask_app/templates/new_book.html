{% extends 'base.html' %}
{% block title %}BookHub - Nuevo Libro{% endblock %}
{% block content %}
<div class="form-page">
  <div class="mb-4"><h1 class="h2">Agregar Nuevo Libro</h1><p class="text-muted">Comparte un libro con la comunidad.</p></div>
  <div class="card shadow-sm"><div class="card-body p-4">
    <form method="post" action="{{ url_for('crear_libro') }}">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Título</label><input class="form-control" name="titulo" value="{{ libro.titulo if libro else '' }}" required minlength="2"></div>
        <div class="col-md-6"><label class="form-label">Autor</label><input class="form-control" name="autor" value="{{ libro.autor if libro else '' }}" required></div>
        <div class="col-md-6"><label class="form-label">Género</label><select class="form-select" name="genero" required><option value="">Selecciona un género</option>{% for genero in generos %}<option value="{{ genero }}" {% if libro and libro.genero == genero %}selected{% endif %}>{{ genero }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Fecha de publicación</label><input type="date" class="form-control" name="fecha_publicacion" value="{{ libro.fecha_publicacion if libro else '' }}" max="{{ today if today else '' }}" required></div>
        <div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="5" minlength="10" required>{{ libro.descripcion if libro else '' }}</textarea></div>
      </div>
      <div class="mt-4 d-flex gap-2"><button class="btn btn-dark"><i class="bi bi-check-lg me-1" aria-hidden="true"></i>Guardar</button><a class="btn btn-outline-secondary" href="{{ url_for('libros') }}"><i class="bi bi-x-lg me-1" aria-hidden="true"></i>Cancelar</a></div>
    </form>
  </div></div>
</div>
{% endblock %}
