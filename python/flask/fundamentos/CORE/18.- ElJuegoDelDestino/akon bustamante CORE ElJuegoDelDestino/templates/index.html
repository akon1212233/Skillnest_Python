<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="destino-card">

            <!-- ENCABEZADO -->
            <div class="card-header-custom">
                <div class="icono-circulo icono-luna">
                    <i class="bi bi-moon-stars-fill"></i>
                </div>
                <h1>El Juego del Destino</h1>
                <p class="descripcion">Descubre qué te depara el futuro</p>
            </div>

            <!-- CUERPO -->
            <div class="card-body-custom">
                <form action="{{ url_for('enviar') }}" method="POST">

                    <!-- Nombre -->
                    <div class="campo-form">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <!-- Edad -->
                    <div class="campo-form">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
                            <input type="number" id="edad" name="edad" min="1" max="120" class="form-control" placeholder="Tu edad" required>
                        </div>
                    </div>

                    <!-- Color favorito -->
                    <div class="campo-form">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-palette-fill"></i></span>
                            <input type="text" id="color" name="color" class="form-control" placeholder="Tu color favorito" required>
                        </div>
                        <small class="texto-ayuda">Ej. rojo, azul, verde, morado, amarillo...</small>
                    </div>

                    <!-- Animal favorito -->
                    <div class="campo-form">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-heart-fill"></i></span>
                            <input type="text" id="animal" name="animal" class="form-control" placeholder="Tu animal favorito" required>
                        </div>
                        <small class="texto-ayuda">Ej. perro, gato, águila, león, delfín...</small>
                    </div>

                    <!-- Orbe decorativo -->
                    <div class="orbe"></div>

                    <!-- Botón -->
                    <button type="submit" class="btn-destino">
                        <i class="bi bi-pencil-fill"></i> Revelar mi destino
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
