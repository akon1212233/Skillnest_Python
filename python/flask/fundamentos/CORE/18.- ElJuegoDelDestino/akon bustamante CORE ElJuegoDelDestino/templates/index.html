<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Destino - Formulario</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; }
        .card-custom { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-custom p-4 bg-white">
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-bold text-primary">🔮 El Oráculo Digital</h1>
                        <p class="text-muted">Ingresa tus datos para revelar qué te depara el futuro.</p>
                    </div>
                    
                    <form action="{{ url_for('enviar') }}" method="POST">
                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Tu Nombre:</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Carlos" required>
                        </div>

                        <!-- Edad -->
                        <div class="mb-3">
                            <label for="edad" class="form-label fw-semibold">Tu Edad:</label>
                            <input type="number" id="edad" name="edad" min="1" max="120" class="form-control" placeholder="Ej: 25" required>
                        </div>

                        <!-- Color Favorito -->
                        <div class="mb-4">
                            <label for="color" class="form-label fw-semibold">Tu Color Favorito:</label>
                            <input type="text" id="color" name="color" class="form-control" placeholder="Ej: Azul" required>
                        </div>

                        <!-- Botón -->
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                            Descubrir mi Destino ✨
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
